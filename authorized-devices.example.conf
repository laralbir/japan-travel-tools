# ==============================================================================
# Listado de Dispositivos Autorizados para Instalación y Debug vía ADB
# ==============================================================================
# INSTRUCCIONES:
# 1. Copia este archivo a `authorized-devices.local.conf` en la raíz del proyecto:
#      cp authorized-devices.example.conf authorized-devices.local.conf
# 2. `authorized-devices.local.conf` está en `.gitignore` y NUNCA se commitea.
# 3. Añade un dispositivo autorizado por línea con el formato:
#      <SERIAL_O_IP_PORT_ADB> | <ALIAS_DEL_DISPOSITIVO>
#
# Puedes obtener el serial exacto conectando el dispositivo y ejecutando:
#   ~/Library/Android/sdk/platform-tools/adb devices -l
#
# Ejemplos para los dispositivos objetivo del proyecto:
# 48091FDAP00XXX | Google Pixel 10 Pro XL
# 39241FDJH00YYY | Google Pixel 9 Pro XL
# TCLNXT11P00ZZZ | Tablet TCL NXTPAPER 11 Plus
# 192.168.1.55:5555 | Pixel 10 Pro XL (Wireless Debugging)

